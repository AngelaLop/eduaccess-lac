# Nixpacks build config for the worker (apps/worker).
#
# Strategy: don't override the setup phase — let Nixpacks auto-detect Node
# from package.json. We only override install/build/start to:
#   1. Add pnpm (Nixpacks defaults to npm; our lockfile is pnpm)
#   2. Skip the build step entirely (worker uses tsx runtime, no compile)
#   3. Filter the start command to the worker package only

[phases.install]
cmds = [
  "npm install -g pnpm@10.33.2",
  "pnpm install --frozen-lockfile --prod=false"
]

[phases.build]
cmds = []

[start]
cmd = "pnpm --filter worker start"
