# Nixpacks build config for the worker (apps/worker).
#
# With a root package.json declaring engines.node + packageManager, Nixpacks's
# Node provider auto-detects everything: installs Node 22, enables corepack for
# pnpm, runs `pnpm install` against the workspace lockfile, skips build (no
# root build script), and we just override the start command to filter to the
# worker package.

[start]
cmd = "pnpm --filter worker start"
